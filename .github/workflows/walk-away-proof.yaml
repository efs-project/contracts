name: Walk-Away Proof

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/walk-away-proof.yaml"
      - "packages/walk-away-proof/**"
      - "yarn.lock"
  pull_request:
    paths:
      - ".github/workflows/walk-away-proof.yaml"
      - "packages/walk-away-proof/**"
      - "yarn.lock"

permissions:
  contents: read

jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: [22, 26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn workspace @efs/walk-away-proof artifact
      - run: yarn workspace @efs/walk-away-proof artifact:assert
      - run: yarn workspace @efs/walk-away-proof test
      - run: yarn workspace @efs/walk-away-proof build

      - name: Show reproduced identity
        run: cat packages/walk-away-proof/output/artifact-build.json

      - uses: actions/upload-artifact@v4
        with:
          name: efs-walk-away-proof-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            packages/walk-away-proof/output/efs-sepolia-deployment-reference-v0.tar.gz
            packages/walk-away-proof/output/artifact-build.json
          if-no-files-found: error

      - name: Verify published proof through IPFS
        if: ${{ hashFiles('packages/walk-away-proof/proof/proof.json') != '' }}
        run: >-
          yarn workspace @efs/walk-away-proof verify
          --manifest packages/walk-away-proof/proof/manifest.json
          --proof packages/walk-away-proof/proof/proof.json
          --carrier ipfs

      - name: Verify published proof through Arweave
        if: ${{ hashFiles('packages/walk-away-proof/proof/proof.json') != '' }}
        run: >-
          yarn workspace @efs/walk-away-proof verify
          --manifest packages/walk-away-proof/proof/manifest.json
          --proof packages/walk-away-proof/proof/proof.json
          --carrier arweave
